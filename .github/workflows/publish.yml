name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
#
# Supply-chain notes, because this job can push code to every `pip install realhands`:
#  * The ref is never attacker-supplied. A `release` run builds the tag recorded on
#    the release itself; a manual run builds whatever tag it was dispatched against.
#    There is no free-form `ref` input, so nobody with write access can point this at
#    an unreviewed branch and publish it under the project's trusted-publisher identity.
#  * Both triggers are gated to `refs/tags/v*`, so a modified copy of this workflow on
#    some side branch cannot be dispatched to publish.
#  * The built version must equal the tag, so a tag can never ship a different version.
#  * Every action is pinned to a full commit SHA. The publish job holds `id-token: write`
#    and a mutable tag (`@v7`, `@release/v1`) on any action in that job would let a
#    compromised upstream mint a PyPI credential and publish arbitrary code.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to build anything that is not a version tag
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
        run: |
          case "$TAG" in
            refs/tags/v*|v*) echo "Building $TAG" ;;
            *) echo "::error::Refusing to publish from '$TAG' — tag v* only."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the built version matches the tag
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import glob, os, re, sys
          tag = os.environ["TAG"].removeprefix("refs/tags/").lstrip("v")
          built = {re.match(r"realhands-(.+?)-py3", os.path.basename(p)).group(1)
                   for p in glob.glob("dist/*.whl")}
          print(f"tag={tag} built={sorted(built)}")
          if built != {tag}:
              sys.exit(f"::error::Tag v{tag} does not match built version(s) {sorted(built)}")
          PY

      - name: Verify the MCP registry ownership marker survived packaging
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              text = z.read(meta).decode("utf-8", "replace")
          marker = "mcp-name: io.github.kanishka089/realhands"
          print(f"{whl}: marker {'found' if marker in text else 'MISSING'}")
          sys.exit(0 if marker in text else 1)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # 0.1.1 and 0.2.0 both shipped BROKEN: `mcp>=1.2` silently resolved to mcp 2.x, which
  # renamed FastMCP -> MCPServer and moved it, so every fresh install died at import.
  # `twine check` validates packaging metadata only and cannot catch a dependency
  # resolution that yields an unimportable package — nothing but a real install-and-run
  # can. Runs on Windows because that is the platform this package targets (pyautogui
  # and pywin32 need a real desktop session), and across both mcp majors because the
  # import shim in server.py is the thing most likely to rot.
  smoke:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp>=1.2,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the wheel with ${{ matrix.mcp }}
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet dist/*.whl "${{ matrix.mcp }}"

      - name: Import the server and check the tool contract
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from importlib.metadata import version
          import realhands
          from realhands.server import mcp, computer     # the import that broke in 2.x
          print(f"realhands {realhands.__version__} | mcp {version('mcp')} | {type(mcp).__name__}")

          tools = asyncio.run(mcp.list_tools())
          tool = next(t for t in tools if t.name == "computer")
          schema = getattr(tool, "input_schema", None) or getattr(tool, "inputSchema")
          params = set(schema["properties"])
          print("params:", sorted(params))

          # The batching contract users depend on — losing these silently would be
          # a far worse regression than a hard import error.
          missing = {"action", "steps", "screenshot", "coordinate", "monitor"} - params
          assert not missing, f"tool is missing parameters: {sorted(missing)}"
          print("OK: server imports and the tool contract is intact")
          PY

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    # Must match the environment configured on the PyPI trusted publisher.
    environment: pypi
    permissions:
      id-token: write # required for OIDC — this is what replaces the API token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
