name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# Fires automatically when a GitHub release is published; workflow_dispatch lets you
# publish a release that already exists (or re-run after a failure).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.2.0)"
        required: true
        default: v0.2.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the MCP registry ownership marker survived packaging
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              text = z.read(meta).decode("utf-8", "replace")
          marker = "mcp-name: io.github.kanishka089/realhands"
          print(f"{whl}: marker {'found' if marker in text else 'MISSING'}")
          sys.exit(0 if marker in text else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment configured on the PyPI trusted publisher.
    environment: pypi
    permissions:
      id-token: write # required for OIDC — this is what replaces the API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
